[build-system]
requires = ["setuptools >= 65", "wheel >= 0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "si-wrapper"
version = "0.9.0"
dependencies = [
  "numpy>=1.23.0",
  "matplotlib>=3.5.0",
  "coloredlogs>=15.0.1",
  "pyyaml",
  "typer>=0.12.3"
]

[project.scripts]
si-wrapper= "si_wrapper.main:app"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.17.1",
]
docs = [
    "sphinx==8.2.3",
    "antmicro-sphinx-utils @ https://github.com/antmicro/antmicro-sphinx-utils/archive/main.zip",
    "sphinx-inline-tabs"
]


[tool.setuptools]
package-dir = { "si_wrapper" = "src/si_wrapper" }

[tool.setuptools.package-data]
"si_wrapper" = ["footprint/Simulation_Port.kicad_mod"]

[tool.ruff.lint]
select = ["E", "F", "N", "B", "A", "RET"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
	"docs",
	"src/si_wrapper/__init__.py",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

